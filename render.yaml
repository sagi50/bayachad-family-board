services:
  - type: web
    name: bayachad-family-board
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_USERNAME
        sync: false
      - key: INITIAL_DISPLAY_NAME
        sync: false
      - key: INITIAL_PASSWORD
        sync: false

